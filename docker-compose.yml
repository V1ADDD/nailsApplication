name: nails

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nails
      POSTGRES_DB: nails
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set it in .env, see .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nails -d nails"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=nails;Username=nails;Password=${POSTGRES_PASSWORD}"
      Modules__Identity__Bootstrap__OwnerEmail: ${OWNER_EMAIL:?Set it in .env, see .env.example}
      Modules__Identity__Bootstrap__OwnerPassword: ${OWNER_PASSWORD:?Set it in .env, see .env.example}
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: client
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
